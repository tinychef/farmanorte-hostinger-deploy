<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240" fill="none">
  <defs>
    <linearGradient id="jarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="30%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <filter id="shadowJar" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <ellipse cx="160" cy="215" rx="80" ry="12" fill="#0F172A" opacity="0.08"/>
  <g filter="url(#shadowJar)">
    <!-- Tapa Azul CeraVe -->
    <rect x="95" y="45" width="130" height="25" rx="6" fill="#0284C7" stroke="#0369A1" stroke-width="1"/>
    <!-- Pote Blanco -->
    <rect x="100" y="70" width="120" height="120" rx="14" fill="url(#jarGrad)" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="100" y="95" width="120" height="70" fill="#F0F9FF"/>
    
    <text x="160" y="118" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="900" fill="#0284C7" text-anchor="middle">CeraVe</text>
    <text x="160" y="132" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800" fill="#0F172A" text-anchor="middle">Moisturising Cream</text>
    <text x="160" y="145" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="600" fill="#64748B" text-anchor="middle">3 Ceramidas Esenciales</text>
    <text x="160" y="157" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="700" fill="#059669" text-anchor="middle">454 g / 16 oz</text>
  </g>
</svg>
