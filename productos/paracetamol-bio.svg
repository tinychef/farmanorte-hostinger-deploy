<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240" fill="none">
  <defs>
    <linearGradient id="boxGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <filter id="shadow1" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  
  <!-- Sombra del piso -->
  <ellipse cx="160" cy="215" rx="100" ry="12" fill="#0F172A" opacity="0.08"/>
  
  <!-- Caja 3D Frontal -->
  <g filter="url(#shadow1)">
    <rect x="50" y="40" width="220" height="150" rx="12" fill="url(#boxGrad1)" stroke="#CBD5E1" stroke-width="1.5"/>
    
    <!-- Franja Superior Laboratorio Chile (Azul Marino) -->
    <path d="M50 40 Q50 40 50 40 L270 40 Q270 40 270 40 L270 68 L50 68 Z" fill="#1B4D9B"/>
    <text x="65" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">LABORATORIO CHILE | teva</text>
    
    <!-- Sello Bioequivalente Oficial ISP Chile (Franja Amarilla y Roja) -->
    <rect x="50" y="68" width="220" height="8" fill="#FACC15"/>
    <rect x="50" y="76" width="220" height="4" fill="#DC2626"/>
    <text x="215" y="75" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="900" fill="#000000">BIOEQUIVALENTE</text>
    
    <!-- Nombre del Medicamento -->
    <text x="65" y="112" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="900" fill="#0F172A">PARACETAMOL</text>
    <text x="65" y="132" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#1B4D9B">500 mg</text>
    <text x="65" y="152" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#64748B">16 Comprimidos recubiertos</text>
    <text x="65" y="172" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#059669">Venta bajo receta / Libre acceso</text>

    <!-- Pastillas / Blister visual -->
    <circle cx="230" cy="130" r="14" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <circle cx="230" cy="130" r="10" fill="#FFFFFF"/>
    <line x1="223" y1="130" x2="237" y2="130" stroke="#CBD5E1" stroke-width="1.5"/>
  </g>
</svg>
